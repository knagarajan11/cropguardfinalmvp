recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  num_epochs: 1
  ckpt_every_steps: 100
  val_every_steps: 100
  log_remote_every_steps: 1
  gc_every_steps: 5

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

# ============================================================
# MODEL
# ============================================================

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /workspace/hf_cache/hub/models--nvidia--Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16/snapshots/e5e9932441de940c9a62185c870ea5bcd4cd24e2
  trust_remote_code: true
  torch_dtype: bfloat16

# ============================================================
# PROCESSOR
# ============================================================

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: /workspace/hf_cache/hub/models--nvidia--Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16/snapshots/e5e9932441de940c9a62185c870ea5bcd4cd24e2
  trust_remote_code: true

# ============================================================
# LoRA
# ============================================================

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: false

  exclude_modules:
    - "*vision_tower*"
    - "*vision*"
    - "*visual*"
    - "*image_encoder*"
    - "*audio*"
    - "*sound*"
    - "*lm_head*"

  dim: 8
  alpha: 32
  use_triton: true

# ============================================================
# FREEZE CONFIG
# ============================================================

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

# ============================================================
# DISTRIBUTED
# ============================================================

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager

  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 1

  sequence_parallel: false
  activation_checkpointing: true

dtype: bf16

# ============================================================
# PIPELINE
# ============================================================

pipeline:
  pp_schedule: interleaved1f1b
  pp_microbatch_size: 1
  scale_grads_in_schedule: false

# ============================================================
# LOSS
# ============================================================

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# ============================================================
# DATASET
# ============================================================

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.load_dataset
  path: json
  data_files: /workspace/data/sft/train.jsonl
  split: train

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.load_dataset
  path: json
  data_files: /workspace/data/sft/validation.jsonl
  split: train

# ============================================================
# DATALOADER
# ============================================================

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0

# ============================================================
# OPTIMIZER
# ============================================================

optimizer:
  _target_: torch.optim.AdamW

  betas:
    - 0.9
    - 0.999

  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.01

# ============================================================
# CHECKPOINT
# ============================================================

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/outputs/lora/cropguard_nemotron_lora
  save_consolidated: true
  max_recent_checkpoints: null
