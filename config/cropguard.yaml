knowledge:
  build_index_on_start: false

  sources:
    json:
      enabled: true
      path: /workspace/knowledge/sample_data/treatment_knowledge.jsonl

    pdf:
      enabled: true
      path: /workspace/knowledge/external/pdf

    web:
      enabled: true
      registry: /workspace/knowledge/external/web/sources.yaml

  embedding:
    model: nvidia/llama-nemotron-embed-vl-1b-v2
    chunk_size: 1000
    chunk_overlap: 150
    index_type: FAISS-IndexFlatIP

  index:
    path: /workspace/index/recommendation
